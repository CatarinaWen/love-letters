<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>收信快樂 · Love Letters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9d8b8;--card:#f6ecd6;--ink:#4a3a2a;--mut:#8a7458;--line:#cdb48a;--pink:#e2a9a1;--blue:#9cc3de;--wax:#8b2e2e;--pen:#e8a317;--f:"Cactus Classical Serif","Noto Serif TC",serif;--h:640px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b231b;--card:#3a3026;--ink:#f0e4cc;--mut:#b9a684;--line:#5a4a38}}
:root[data-theme="dark"]{--bg:#2b231b;--card:#3a3026;--ink:#f0e4cc;--mut:#b9a684;--line:#5a4a38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);min-height:100vh}
.hero{position:relative;max-width:1320px;margin:auto}
.hero img{width:100%;height:140px;object-fit:cover;object-position:60% 40%;display:block}
.hero h1{position:absolute;left:0;right:0;bottom:0;margin:0;padding:22px 16px 8px;text-align:center;font-size:21px;letter-spacing:.2em;background:linear-gradient(transparent,var(--bg))}
main{max-width:1320px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;box-shadow:2px 3px 0 #0002}
.wrap{overflow-x:auto;overflow-y:hidden;border:2px solid var(--ink);border-radius:4px;-webkit-overflow-scrolling:touch}
#scene{position:relative;width:calc(var(--h)*16/7);height:var(--h);background:#f4ecd8}
.d{position:absolute;width:120px;padding:10px;background:#fbf5e6;border:1px solid var(--line);box-shadow:2px 2px 5px #0003;cursor:pointer;border-radius:4px}
.d b{display:block;font-size:12px;color:var(--wax);margin-bottom:4px}
.d p{margin:0;font-size:13px;word-break:break-word}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--wax);border-color:var(--wax);color:#fff}
#panel{position:sticky;top:10px;display:flex;flex-direction:column;gap:10px}
.msgs{min-height:200px;max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.m{background:#fffaf0;color:#4a3a2a;padding:8px 12px;font-size:14px;border-radius:4px;border:1px solid var(--line);position:relative}
.m b{display:block;font-size:12px;color:var(--wax)}
.m button{position:absolute;right:6px;top:6px;font-size:11px;padding:2px 6px;border-color:var(--wax);color:var(--wax)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:#fffaf0;border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px}
textarea{min-height:70px;resize:vertical}
@media(max-width:899px){main{grid-template-columns:minmax(0,1fr)}}
</style>

<!-- 引入 Firebase Web SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="hero">
  <h1>收信快樂 · Love Letters</h1>
</div>

<main>
  <div class="card">
    <div class="wrap">
      <div id="scene"></div>
    </div>
  </div>

  <div id="panel" class="card">
    <h3>寄出一封信</h3>
    <input type="text" id="senderName" placeholder="您的名字/暱稱..." maxlength="20">
    <textarea id="letterContent" placeholder="寫下想說的話..."></textarea>
    <button class="pri" onclick="sendLetter()">寄出信件（儲存至雲端）</button>

    <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:10px 0;">

    <h3>所有信件列表</h3>
    <div class="msgs" id="msgList"></div>
  </div>
</main>

<script>
  // 帶入您專屬的 Firebase 設定資訊
  const firebaseConfig = {
    apiKey: "AIzaSyC7rLmV5rDr7jftqsxyan-P_ok4VYrL0cU",
    authDomain: "love-letters-mgfwinter2026.firebaseapp.com",
    databaseURL: "https://love-letters-mgfwinter2026-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "love-letters-mgfwinter2026",
    storageBucket: "love-letters-mgfwinter2026.firebasestorage.app",
    messagingSenderId: "411025345780",
    appId: "1:411025345780:web:8f432e5b32c7082a4ee2a1",
    measurementId: "G-6PNS8592WS"
  };

  // 初始化 Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const lettersRef = database.ref('letters');

  // 即時監聽雲端資料庫變更
  lettersRef.on('value', (snapshot) => {
    const data = snapshot.val();
    const scene = document.getElementById('scene');
    const msgList = document.getElementById('msgList');
    
    scene.innerHTML = '';
    msgList.innerHTML = '';

    if (data) {
      Object.keys(data).forEach((key) => {
        const item = data[key];
        
        // 渲染到畫布貼板
        const note = document.createElement('div');
        note.className = 'd';
        note.style.left = (item.x || 20) + 'px';
        note.style.top = (item.y || 20) + 'px';
        note.innerHTML = `<b>${escapeHtml(item.name)}</b><p>${escapeHtml(item.text)}</p>`;
        scene.appendChild(note);

        // 渲染到右側歷史清單
        const msg = document.createElement('div');
        msg.className = 'm';
        msg.innerHTML = `
          <b>${escapeHtml(item.name)} (${new Date(item.timestamp).toLocaleDateString()})</b>
          <div>${escapeHtml(item.text)}</div>
          <button onclick="deleteLetter('${key}')">刪除</button>
        `;
        msgList.appendChild(msg);
      });
    } else {
      msgList.innerHTML = '<div style="color:var(--mut);font-size:13px;">目前還沒有信件，快來寫第一封信吧！</div>';
    }
  });

  // 發送信件至 Firebase 雲端
  function sendLetter() {
    const nameInput = document.getElementById('senderName');
    const contentInput = document.getElementById('letterContent');
    
    const name = nameInput.value.trim() || '匿名';
    const text = contentInput.value.trim();

    if (!text) {
      alert('請輸入信件內容！');
      return;
    }

    const sceneWidth = document.getElementById('scene').clientWidth - 140;
    const sceneHeight = document.getElementById('scene').clientHeight - 100;
    const randomX = Math.max(20, Math.floor(Math.random() * sceneWidth));
    const randomY = Math.max(20, Math.floor(Math.random() * sceneHeight));

    lettersRef.push({
      name: name,
      text: text,
      x: randomX,
      y: randomY,
      timestamp: Date.now()
    }).then(() => {
      contentInput.value = '';
    }).catch((error) => {
      alert('儲存失敗：' + error.message);
    });
  }

  // 刪除雲端信件
  function deleteLetter(key) {
    if (confirm('確定要刪除這封信件嗎？')) {
      lettersRef.child(key).remove();
    }
  }

  // 防範 XSS 攻擊
  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>

</body>
</html>
